name: Store publishing checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  guards:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify submission guards without network or credentials
        shell: pwsh
        run: ./tools/Test-StorePublishing.ps1
