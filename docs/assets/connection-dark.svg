<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">Lapdroid connection overview</title><desc id="desc">Windows laptop: Keyboard + touchpad · F12 toggle. Bluetooth RFCOMM: Paired devices · no Wi-Fi needed. Android phone: Pointer overlay + Accessibility</desc><rect width="1000" height="450" rx="20" fill="#172C42"/><text x="48" y="62" fill="#9FCAFF" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">HOW LAPDROID CONNECTS</text><path d="M302 213h48m300 0h48" stroke="#9FCAFF" stroke-width="3"/><path d="m340 205 10 8-10 8m348-16 10 8-10 8" fill="none" stroke="#9FCAFF" stroke-width="3"/><rect x="48" y="130" width="252" height="160" rx="14" fill="#1A1E26" stroke="#9FCAFF" stroke-opacity=".3"/><text x="174" y="185" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#E2E2E9">Windows laptop</text><text x="174" y="230" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#C4C6D0">Keyboard + touchpad · F12 toggle</text><rect x="374" y="130" width="252" height="160" rx="14" fill="#1A1E26" stroke="#9FCAFF" stroke-opacity=".3"/><text x="500" y="185" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#E2E2E9">Bluetooth RFCOMM</text><text x="500" y="230" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#C4C6D0">Paired devices · no Wi-Fi needed</text><rect x="700" y="130" width="252" height="160" rx="14" fill="#1A1E26" stroke="#9FCAFF" stroke-opacity=".3"/><text x="826" y="185" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#E2E2E9">Android phone</text><text x="826" y="230" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#C4C6D0">Pointer overlay + Accessibility</text><text x="48" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#C4C6D0">Install the app on both devices, then press F12 to switch control.</text></svg>