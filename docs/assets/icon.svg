<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3346"/>
      <stop offset="100%" stop-color="#182030"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f192b"/>
      <stop offset="100%" stop-color="#070d18"/>
    </linearGradient>
    <linearGradient id="btGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="androidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#28b463"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232b3c"/>
      <stop offset="100%" stop-color="#151b27"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="#303b50" stroke-width="4"/>

  <!-- Left: Laptop Representation -->
  <!-- Screen Lid -->
  <rect x="64" y="112" width="220" height="150" rx="12" fill="url(#laptopGrad)" stroke="#445577" stroke-width="3"/>
  <rect x="74" y="122" width="200" height="130" rx="8" fill="url(#screenGrad)"/>

  <!-- Windows Logo on screen -->
  <g transform="translate(144, 157) scale(0.65)">
    <rect x="0" y="0" width="40" height="40" fill="#0078d4" rx="3"/>
    <rect x="46" y="0" width="40" height="40" fill="#0078d4" rx="3"/>
    <rect x="0" y="46" width="40" height="40" fill="#0078d4" rx="3"/>
    <rect x="46" y="46" width="40" height="40" fill="#0078d4" rx="3"/>
  </g>

  <!-- Laptop Keyboard Base -->
  <polygon points="44,262 304,262 334,310 14,310" fill="#202736" stroke="#445577" stroke-width="3"/>
  <!-- Trackpad -->
  <rect x="140" y="280" width="68" height="24" rx="4" fill="#121722" stroke="#36435c" stroke-width="2"/>

  <!-- Right: Android Smartphone Representation -->
  <rect x="310" y="96" width="138" height="264" rx="28" fill="url(#phoneGrad)" stroke="#445577" stroke-width="4"/>
  <rect x="320" y="112" width="118" height="232" rx="20" fill="url(#screenGrad)"/>

  <!-- Speaker slit & Camera notch -->
  <circle cx="379" cy="126" r="4.5" fill="#0d1420"/>

  <!-- Android Robot Head on Phone Screen -->
  <g transform="translate(345, 175) scale(0.7)">
    <!-- Head -->
    <path d="M 12,65 A 36,36 0 0 1 84,65 Z" fill="url(#androidGrad)"/>
    <!-- Eyes -->
    <circle cx="32" cy="46" r="4" fill="#ffffff"/>
    <circle cx="64" cy="46" r="4" fill="#ffffff"/>
    <!-- Antennae -->
    <line x1="28" y1="28" x2="18" y2="12" stroke="#3ddc84" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="28" x2="78" y2="12" stroke="#3ddc84" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Center Bridge: Glowing Bluetooth Waves & Stylus Bridge -->
  <!-- Bluetooth Rune -->
  <g transform="translate(256, 360) scale(0.85)" filter="url(#glow)">
    <circle cx="0" cy="0" r="54" fill="#0a182d" stroke="#0099ff" stroke-width="4"/>
    <path d="M -8,-32 L -8,32 L 18,12 L -20,-14 L 18,-14 L -8,-32 L 18,-12 L -8,6"
          fill="none" stroke="url(#btGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Dynamic Waves between Laptop and Phone -->
  <path d="M 230,200 C 270,180 270,200 310,180" fill="none" stroke="#00aaff" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.85"/>
  <path d="M 230,225 C 270,205 270,225 310,205" fill="none" stroke="#3ddc84" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.85"/>

  <!-- S-Pen / Stylus Indicator -->
  <g transform="translate(385, 385) rotate(-35) scale(0.65)">
    <rect x="-8" y="-70" width="16" height="110" rx="4" fill="#303b50" stroke="#50668d" stroke-width="3"/>
    <polygon points="-8,40 8,40 0,65" fill="#00aaff"/>
    <rect x="-4" y="-30" width="8" height="24" rx="3" fill="#00aaff"/>
  </g>
</svg>